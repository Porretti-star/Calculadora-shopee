<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Shopee</title>
  <style>
    body { font-family: Arial, sans-serif; background-color: #f4f6f9; margin: 0; padding: 15px; display: flex; justify-content: center; }
    .container { background-color: #fff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); width: 100%; max-width: 450px; }
    h1 { text-align: center; color: #ee4d2d; font-size: 22px; margin-bottom: 15px; }
    .form-group { margin-bottom: 12px; }
    label { display: block; font-size: 13px; font-weight: bold; margin-bottom: 4px; color: #333; }
    input[type="text"], input[type="number"], select { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; font-size: 14px; }
    .row { display: flex; gap: 10px; }
    .row .form-group { flex: 1; }
    .checkbox-group { display: flex; align-items: center; gap: 8px; font-size: 13px; margin: 10px 0; }
    .btn-group { display: flex; gap: 10px; margin: 15px 0; }
    button { flex: 1; padding: 10px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; color: white; }
    .btn-calcular { background-color: #ee4d2d; }
    .btn-salvar { background-color: #27ae60; }
    .resultado-box { background-color: #f8f9fa; border: 1px solid #e2e8f0; border-radius: 8px; padding: 12px; margin-top: 15px; }
    .resultado-linha { display: flex; justify-content: space-between; margin-bottom: 6px; font-size: 13px; color: #4a5568; }
    .resultado-linha.destaque { font-weight: bold; color: #2d3748; font-size: 15px; border-top: 1px solid #cbd5e1; padding-top: 6px; }
    .saved-section { margin-top: 20px; border-top: 2px dashed #e2e8f0; padding-top: 15px; }
    .saved-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    .saved-header h2 { font-size: 16px; color: #333; margin: 0; }
    .btn-limpar-tudo { background: #e53e3e; color: white; border: none; padding: 4px 8px; border-radius: 4px; font-size: 11px; cursor: pointer; }
    .item-salvo { background: #f7fafc; border: 1px solid #edf2f7; padding: 8px; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; font-size: 12px; }
    .btn-deletar-item { background: #feb2b2; color: #9b2c2c; border: none; border-radius: 4px; padding: 4px 8px; cursor: pointer; }
  </style>
</head>
<body>

  <div class="container">
    <h1>Calculadora Shopee</h1>

    <div class="form-group">
      <label for="nomeProduto">Nome do Produto / Referência:</label>
      <input type="text" id="nomeProduto" placeholder="Ex: Areia Gato Bill Fardo">
    </div>

    <div class="row">
      <div class="form-group">
        <label for="precoCusto">Preço de Custo (R$):</label>
        <input type="number" id="precoCusto" placeholder="0.00" step="0.01">
      </div>
      <div class="form-group">
        <label for="precoVenda">Preço de Venda (R$):</label>
        <input type="number" id="precoVenda" placeholder="0.00" step="0.01">
      </div>
    </div>

    <!-- NOVOS CAMPOS: EMBALAGEM E IMPOSTO -->
    <div class="row">
      <div class="form-group">
        <label for="custoEmbalagem">Embalagem (R$):</label>
        <input type="number" id="custoEmbalagem" placeholder="0.00" step="0.01">
      </div>
      <div class="form-group">
        <label for="aliquotaImposto">Imposto (%):</label>
        <input type="number" id="aliquotaImposto" placeholder="0" step="0.1">
      </div>
    </div>

    <div class="checkbox-group">
      <input type="checkbox" id="datasDuplas">
      <label for="datasDuplas" style="margin:0;">Campanha Datas Duplas (+2.5% comissão)</label>
    </div>

    <div class="btn-group">
      <button class="btn-calcular" onclick="calcular()">Calcular</button>
      <button class="btn-salvar" onclick="salvarItem()">Salvar no Celular</button>
    </div>

    <div class="resultado-box">
      <div class="resultado-linha"><span>Comissão %:</span><span id="resComissaoPct">0%</span></div>
      <div class="resultado-linha"><span>Taxa Fixa da Faixa:</span><span id="resTaxaFixa">R$ 0,00</span></div>
      <div class="resultado-linha"><span>Imposto Calculado:</span><span id="resImposto">R$ 0,00</span></div>
      <div class="resultado-linha"><span>Total de Taxas e Custos:</span><span id="resTotalCustos">R$ 0,00</span></div>
      <div class="resultado-linha"><span>Valor Líquido Recebido:</span><span id="resLiquido">R$ 0,00</span></div>
      <div class="resultado-linha destaque"><span>Lucro Bruto:</span><span id="resLucro">R$ 0,00</span></div>
      <div class="resultado-linha"><span>Margem de Lucro:</span><span id="resMargem">0%</span></div>
    </div>

    <div class="saved-section">
      <div class="saved-header">
        <h2>📁 Itens Salvos neste Celular</h2>
        <button class="btn-limpar-tudo" onclick="limparTudo()">Limpar Tudo</button>
      </div>
      <div id="listaItensSalvos"></div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', carregarItens);

    function calcular() {
      const custo = parseFloat(document.getElementById('precoCusto').value) || 0;
      const venda = parseFloat(document.getElementById('precoVenda').value) || 0;
      const embalagem = parseFloat(document.getElementById('custoEmbalagem').value) || 0;
      const impostoPct = parseFloat(document.getElementById('aliquotaImposto').value) || 0;
      const datasDuplas = document.getElementById('datasDuplas').checked;

      // Comissão padrão Shopee (14% + 6% frete grátis = 20%). Datas duplas adiciona +2.5%
      let comissaoPct = 20.0;
      if (datasDuplas) comissaoPct += 2.5;

      let valorComissao = venda * (comissaoPct / 100);
      if (valorComissao > 100) valorComissao = 100; // Teto de R$ 100

      const taxaFixa = venda > 0 ? (venda < 10 ? 2.00 : 4.00) : 0;
      const valorImposto = venda * (impostoPct / 100);

      const totalTaxasShopee = valorComissao + taxaFixa;
      const totalCustos = custo + embalagem + valorImposto + totalTaxasShopee;
      const valorLiquido = venda - totalTaxasShopee;
      const lucro = venda - totalCustos;
      const margem = venda > 0 ? (lucro / venda) * 100 : 0;

      document.getElementById('resComissaoPct').innerText = comissaoPct.toFixed(1) + '%';
      document.getElementById('resTaxaFixa').innerText = formatarMoeda(taxaFixa);
      document.getElementById('resImposto').innerText = formatarMoeda(valorImposto);
      document.getElementById('resTotalCustos').innerText = formatarMoeda(totalCustos);
      document.getElementById('resLiquido').innerText = formatarMoeda(valorLiquido);
      document.getElementById('resLucro').innerText = formatarMoeda(lucro);
      document.getElementById('resMargem').innerText = margem.toFixed(2) + '%';

      return { custo, venda, embalagem, impostoPct, lucro, margem };
    }

    function formatarMoeda(valor) {
      return valor.toLocaleString('pt-BR', { style: 'currency', currency: 'BRL' });
    }

    function salvarItem() {
      const nome = document.getElementById('nomeProduto').value;
      if (!nome) {
        alert('Por favor, digite o Nome do Produto/Referência.');
        return;
      }
      const res = calcular();
      const item = { id: Date.now(), nome, custo: res.custo, venda: res.venda };

      let itens = JSON.parse(localStorage.getItem('shopee_itens')) || [];
      itens.push(item);
      localStorage.setItem('shopee_itens', JSON.stringify(itens));
      carregarItens();
    }

    function carregarItens() {
      const lista = document.getElementById('listaItensSalvos');
      const itens = JSON.parse(localStorage.getItem('shopee_itens')) || [];
      lista.innerHTML = '';

      if (itens.length === 0) {
        lista.innerHTML = '<div style="color: #718096; font-size: 13px;">Nenhum item salvo ainda.</div>';
        return;
      }

      itens.forEach(item => {
        const div = document.createElement('div');
        div.className = 'item-salvo';
        div.innerHTML = `
          <div>
            <strong>${item.nome}</strong><br>
            Custo: ${formatarMoeda(item.custo)} | Venda: ${formatarMoeda(item.venda)}
          </div>
          <button class="btn-deletar-item" onclick="deletarItem(${item.id})">Excluir</button>
        `;
        lista.appendChild(div);
      });
    }

    function deletarItem(id) {
      let itens = JSON.parse(localStorage.getItem('shopee_itens')) || [];
      itens = itens.filter(item => item.id !== id);
      localStorage.setItem('shopee_itens', JSON.stringify(itens));
      carregarItens();
    }

    function limparTudo() {
      if (confirm('Tem certeza que deseja apagar todos os itens salvos?')) {
        localStorage.removeItem('shopee_itens');
        carregarItens();
      }
    }
  </script>
</body>
</html>
