<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculadora Shopee</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: #fff5f2;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .container {
      background: #ffffff;
      width: 100%;
      max-width: 450px;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
    }

    h1 {
      color: #ee4d2d;
      text-align: center;
      font-size: 26px;
      margin-bottom: 24px;
      font-weight: 700;
    }

    .input-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      color: #333333;
      margin-bottom: 8px;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid #e2e8f0;
      border-radius: 8px;
      font-size: 16px;
      outline: none;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus,
    input[type="number"]:focus {
      border-color: #ee4d2d;
    }

    .checkbox-group {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 24px;
    }

    .checkbox-group input {
      width: 18px;
      height: 18px;
      accent-color: #ee4d2d;
      cursor: pointer;
    }

    .checkbox-group label {
      margin-bottom: 0;
      font-weight: 500;
      font-size: 14px;
      cursor: pointer;
    }

    .btn-group {
      display: flex;
      gap: 12px;
      margin-bottom: 24px;
    }

    button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s, opacity 0.2s;
    }

    .btn-calcular {
      background-color: #ff4d2e;
      color: white;
    }

    .btn-calcular:hover {
      background-color: #e03e20;
    }

    .btn-salvar {
      background-color: #20b2aa;
      color: white;
    }

    .btn-salvar:hover {
      background-color: #1a9690;
    }

    .resultado-box {
      background-color: #f8fafc;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 16px;
      margin-bottom: 24px;
      display: none;
    }

    .resultado-linha {
      display: flex;
      justify-content: space-between;
      margin-bottom: 8px;
      font-size: 14px;
      color: #4a5568;
    }

    .resultado-linha.destaque {
      font-size: 16px;
      font-weight: 700;
      color: #2d3748;
      border-top: 1px solid #cbd5e1;
      padding-top: 8px;
      margin-top: 8px;
    }

    .divisor {
      border-top: 1px dashed #e2e8f0;
      margin: 20px 0;
    }

    .saved-section h2 {
      font-size: 16px;
      color: #333;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
    }

    .saved-empty {
      font-size: 13px;
      color: #718096;
    }

    .item-salvo {
      background: #f7fafc;
      border: 1px solid #edf2f7;
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 8px;
      font-size: 13px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Calculadora Shopee</h1>

    <div class="input-group">
      <label for="produto">Nome do Produto / Referência:</label>
      <input type="text" id="produto" placeholder="Ex: Areia Gato Bill Fardo">
    </div>

    <div class="input-group">
      <label for="custo">Preço de Custo (R$):</label>
      <input type="number" id="custo" step="0.01" placeholder="0,00" value="">
    </div>

    <div class="input-group">
      <label for="venda">Preço de Venda (R$):</label>
      <input type="number" id="venda" step="0.01" placeholder="0,00" value="">
    </div>

    <div class="checkbox-group">
      <input type="checkbox" id="datasDuplas">
      <label for="datasDuplas">Campanha Datas Duplas (+2,5% comissão)</label>
    </div>

    <div class="btn-group">
      <button class="btn-calcular" onclick="calcular()">Calcular</button>
      <button class="btn-salvar" onclick="salvarLocal()">Salvar no Celular</button>
    </div>

    <div id="resultado" class="resultado-box">
      <div class="resultado-linha">
        <span>Taxas Shopee (20% + R$4):</span>
        <span id="taxaValor">R$ 0,00</span>
      </div>
      <div class="resultado-linha">
        <span>Valor Líquido Recebido:</span>
        <span id="liquidoValor">R$ 0,00</span>
      </div>
      <div class="resultado-linha destaque">
        <span>Lucro Bruto:</span>
        <span id="lucroValor">R$ 0,00</span>
      </div>
      <div class="resultado-linha">
        <span>Margem de Lucro:</span>
        <span id="margemValor">0%</span>
      </div>
      <div class="resultado-linha">
        <span>Markup:</span>
        <span id="markupValor">0%</span>
      </div>
    </div>

    <div class="divisor"></div>

    <div class="saved-section">
      <h2>📁 Itens Salvos neste Celular</h2>
      <div id="listaSalva" class="saved-empty">Nenhum item salvo ainda.</div>
    </div>
  </div>

  <script>
    // Limpa os campos assim que a página é carregada
    window.onload = function() {
      document.getElementById('custo').value = '';
      document.getElementById('venda').value = '';
      document.getElementById('produto').value = '';
      carregarSalvos();
    };

    function calcular() {
      const custo = parseFloat(document.getElementById('custo').value) || 0;
      const venda = parseFloat(document.getElementById('venda').value) || 0;
      const datasDuplas = document.getElementById('datasDuplas').checked;

      if (venda <= 0) {
        alert("Por favor, insira um preço de venda válido.");
        return;
      }

      // Comissão padrão: 20% (14% + 6% frete grátis). Se datas duplas, +2.5%
      const percComissao = datasDuplas ? 0.225 : 0.20;
      const taxaFixa = 4.00;

      const taxasTotais = (venda * percComissao) + taxaFixa;
      const valorLiquido = venda - taxasTotais;
      const lucroBruto = valorLiquido - custo;
      const margem = (lucroBruto / venda) * 100;
      const markup = custo > 0 ? (lucroBruto / custo) * 100 : 0;

      document.getElementById('taxaValor').innerText = `R$ ${taxasTotais.toFixed(2).replace('.', ',')}`;
      document.getElementById('liquidoValor').innerText = `R$ ${valorLiquido.toFixed(2).replace('.', ',')}`;
      document.getElementById('lucroValor').innerText = `R$ ${lucroBruto.toFixed(2).replace('.', ',')}`;
      document.getElementById('margemValor').innerText = `${margem.toFixed(2).replace('.', ',')}%`;
      document.getElementById('markupValor').innerText = `${markup.toFixed(2).replace('.', ',')}%`;

      document.getElementById('resultado').style.display = 'block';
    }

    function salvarLocal() {
      const produto = document.getElementById('produto').value || 'Produto sem nome';
      const custo = parseFloat(document.getElementById('custo').value) || 0;
      const venda = parseFloat(document.getElementById('venda').value) || 0;

      if (venda <= 0) {
        alert("Calcule os valores antes de salvar.");
        return;
      }

      const item = {
        produto,
        custo,
        venda,
        data: new Date().toLocaleDateString('pt-BR')
      };

      let itensSalvos = JSON.parse(localStorage.getItem('shopee_calculos') || '[]');
      itensSalvos.push(item);
      localStorage.setItem('shopee_calculos', JSON.stringify(itensSalvos));

      carregarSalvos();
      alert("Item salvo no celular!");
    }

    function carregarSalvos() {
      let itensSalvos = JSON.parse(localStorage.getItem('shopee_calculos') || '[]');
      const container = document.getElementById('listaSalva');

      if (itensSalvos.length === 0) {
        container.className = 'saved-empty';
        container.innerHTML = 'Nenhum item salvo ainda.';
        return;
      }

      container.className = '';
      container.innerHTML = itensSalvos.map(item => `
        <div class="item-salvo">
          <strong>${item.produto}</strong><br>
          Custo: R$ ${item.custo.toFixed(2).replace('.', ',')} | Venda: R$ ${item.venda.toFixed(2).replace('.', ',')}
        </div>
      `).join('');
    }
  </script>
</body>
                                                                            </html>
