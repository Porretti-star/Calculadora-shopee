<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora Shopee v2.0</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f4f6f9;
            display: flex;
            justify-content: center;
            padding: 15px;
        }
        .container {
            background-color: #ffffff;
            width: 100%;
            max-width: 480px;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        h1 {
            color: #ee4d2d;
            text-align: center;
            font-size: 22px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 12px;
        }
        label {
            display: block;
            font-size: 13px;
            font-weight: bold;
            color: #333333;
            margin-bottom: 4px;
        }
        input[type="text"],
        input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #cccccc;
            border-radius: 6px;
            font-size: 14px;
        }
        .row {
            display: flex;
            gap: 10px;
        }
        .col {
            flex: 1;
        }
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin: 15px 0;
            font-size: 13px;
            font-weight: bold;
            color: #333333;
        }
        .checkbox-group input {
            width: 16px;
            height: 16px;
        }
        .btn-row {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        button {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            color: #ffffff;
            cursor: pointer;
        }
        .btn-calcular {
            background-color: #ee4d2d;
        }
        .btn-salvar {
            background-color: #26aa99;
        }
        .result-box {
            background-color: #f9f9f9;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            padding: 15px;
            margin-bottom: 20px;
        }
        .result-row {
            display: flex;
            justify-content: space-between;
            font-size: 13px;
            margin-bottom: 8px;
            color: #555555;
        }
        .divider {
            border-top: 1px solid #dddddd;
            margin: 10px 0;
        }
        .lucro-row {
            font-size: 15px;
            font-weight: bold;
            color: #000000;
        }
        .lucro-valor {
            color: #26aa99;
            font-size: 18px;
        }
        .saved-section {
            border-top: 1px dashed #cccccc;
            padding-top: 15px;
        }
        .saved-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-size: 14px;
            font-weight: bold;
        }
        .btn-limpar {
            background-color: #ee4d2d;
            color: #ffffff;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 11px;
            cursor: pointer;
            flex: unset;
        }
        .card-item {
            background: #ffffff;
            border: 1px solid #dddddd;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .card-info {
            font-size: 13px;
            flex-grow: 1;
            padding-right: 8px;
        }
        .card-info strong {
            display: block;
            color: #333333;
        }
        .card-info small {
            color: #666666;
        }
        .action-btns {
            display: flex;
            gap: 6px;
        }
        .btn-carregar {
            background-color: #007bff;
            color: #ffffff;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            flex: unset;
        }
        .btn-excluir {
            background-color: #ffcccc;
            color: #cc0000;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            flex: unset;
        }
        .empty-msg {
            font-size: 13px;
            color: #777777;
            text-align: center;
            padding: 10px 0;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Calculadora Shopee</h1>
    
    <div class="form-group">
        <label>Nome do Produto / Referência:</label>
        <input type="text" id="nomeProduto" placeholder="Ex: Areia Gato Bill Fardo">
    </div>

    <div class="row">
        <div class="form-group col">
            <label>Preço de Custo (R$):</label>
            <input type="number" id="precoCusto" step="0.01" placeholder="0.00">
        </div>
        <div class="form-group col">
            <label>Preço de Venda (R$):</label>
            <input type="number" id="precoVenda" step="0.01" placeholder="0.00">
        </div>
    </div>

    <div class="row">
        <div class="form-group col">
            <label>Embalagem (R$):</label>
            <input type="number" id="embalagem" step="0.01" placeholder="0.00" value="0">
        </div>
        <div class="form-group col">
            <label>Imposto (%):</label>
            <input type="number" id="imposto" step="0.01" placeholder="0" value="0">
        </div>
    </div>

    <div class="checkbox-group">
        <input type="checkbox" id="campanhaDatasDuplas">
        <label for="campanhaDatasDuplas" style="margin-bottom:0; cursor:pointer;">Campanha Datas Duplas (+2.5% comissão)</label>
    </div>

    <div class="btn-row">
        <button class="btn-calcular" onclick="calcular()">Calcular</button>
        <button class="btn-salvar" onclick="salvarItem()">Salvar no Celular</button>
    </div>

    <div class="result-box">
        <div class="result-row">
            <span>Comissão %:</span>
            <span id="resComissaoPerc">0%</span>
        </div>
        <div class="result-row">
            <span>Taxa Fixa da Faixa:</span>
            <span id="resTaxaFixa">R$ 0,00</span>
        </div>
        <div class="result-row">
            <span>Imposto Calculado:</span>
            <span id="resImpostoValor">R$ 0,00</span>
        </div>
        <div class="result-row">
            <span>Total de Taxas e Custos:</span>
            <span id="resTotalCustos">R$ 0,00</span>
        </div>
        <div class="result-row">
            <span>Valor Líquido Recebido:</span>
            <span id="resLiquido">R$ 0,00</span>
        </div>
        <div class="divider"></div>
        <div class="result-row lucro-row">
            <span>Lucro Bruto:</span>
            <span id="resLucroBruto" class="lucro-valor">R$ 0,00</span>
        </div>
        <div class="result-row">
            <span>Margem de Lucro:</span>
            <span id="resMargem">0%</span>
        </div>
    </div>

    <div class="saved-section">
        <div class="saved-header">
            <span>📁 Itens Salvos neste Celular</span>
            <button class="btn-limpar" onclick="limparTudo()">Limpar Tudo</button>
        </div>
        <div id="listaItens">
            <div class="empty-msg">Nenhum item salvo ainda.</div>
        </div>
    </div>
</div>

<script>
    function calcular() {
        const custo = parseFloat(document.getElementById('precoCusto').value) || 0;
        const venda = parseFloat(document.getElementById('precoVenda').value) || 0;
        const embalagem = parseFloat(document.getElementById('embalagem').value) || 0;
        const impostoPerc = parseFloat(document.getElementById('imposto').value) || 0;
        const datasDuplas = document.getElementById('campanhaDatasDuplas').checked;

        let comissaoPerc = 20.0;
        if (datasDuplas) {
            comissaoPerc += 2.5;
        }

        const taxaFixa = 4.00;
        const valorComissao = venda * (comissaoPerc / 100);
        const totalMarketplace = valorComissao + taxaFixa;

        const valorImposto = venda * (impostoPerc / 100);
        const totalTaxasCustos = custo + embalagem + totalMarketplace + valorImposto;
        const valorLiquidoRecebido = venda - totalMarketplace;
        
        const lucroBruto = valorLiquidoRecebido - custo - embalagem - valorImposto;
        const margemLucro = venda > 0 ? (lucroBruto / venda) * 100 : 0;

        document.getElementById('resComissaoPerc').innerText = comissaoPerc.toFixed(1) + '%';
        document.getElementById('resTaxaFixa').innerText = 'R$ ' + taxaFixa.toFixed(2).replace('.', ',');
        document.getElementById('resImpostoValor').innerText = 'R$ ' + valorImposto.toFixed(2).replace('.', ',');
        document.getElementById('resTotalCustos').innerText = 'R$ ' + totalTaxasCustos.toFixed(2).replace('.', ',');
        document.getElementById('resLiquido').innerText = 'R$ ' + valorLiquidoRecebido.toFixed(2).replace('.', ',');
        document.getElementById('resLucroBruto').innerText = 'R$ ' + lucroBruto.toFixed(2).replace('.', ',');
        document.getElementById('resMargem').innerText = margemLucro.toFixed(2).replace('.', ',') + '%';
    }

    function salvarItem() {
        const nome = document.getElementById('nomeProduto').value.trim();
        const custo = parseFloat(document.getElementById('precoCusto').value) || 0;
        const venda = parseFloat(document.getElementById('precoVenda').value) || 0;
        const embalagem = parseFloat(document.getElementById('embalagem').value) || 0;
        const imposto = parseFloat(document.getElementById('imposto').value) || 0;
        const datasDuplas = document.getElementById('campanhaDatasDuplas').checked;

        if (!nome) {
            alert('Por favor, informe o nome do produto.');
            return;
        }

        const item = { nome, custo, venda, embalagem, imposto, datasDuplas };

        let itens = JSON.parse(localStorage.getItem('shopee_itens')) || JSON.parse(localStorage.getItem('itensSalvosShopee')) || [];
        itens.push(item);

        localStorage.setItem('shopee_itens', JSON.stringify(itens));
        localStorage.setItem('itensSalvosShopee', JSON.stringify(itens));
        renderizarItens();
        alert('Item salvo com sucesso!');
    }

    function renderizarItens() {
        const listaContainer = document.getElementById('listaItens');
        let itens = JSON.parse(localStorage.getItem('shopee_itens')) || JSON.parse(localStorage.getItem('itensSalvosShopee')) || [];

        if (itens.length === 0) {
            listaContainer.innerHTML = '<div class="empty-msg">Nenhum item salvo ainda.</div>';
            return;
        }

        listaContainer.innerHTML = '';

        itens.forEach((item, index) => {
            const card = document.createElement('div');
            card.className = 'card-item';

            card.innerHTML = `
                <div class="card-info">
                    <strong>${item.nome}</strong>
                    <small>Custo: R$ ${Number(item.custo).toFixed(2).replace('.', ',')} | Venda: R$ ${Number(item.venda).toFixed(2).replace('.', ',')}</small>
                </div>
                <div class="action-btns">
                    <button class="btn-carregar" type="button" onclick="carregarItem(${index})">Abrir</button>
                    <button class="btn-excluir" type="button" onclick="excluirItem(${index})">Excluir</button>
                </div>
            `;

            listaContainer.appendChild(card);
        });
    }

    function carregarItem(index) {
        let itens = JSON.parse(localStorage.getItem('shopee_itens')) || JSON.parse(localStorage.getItem('itensSalvosShopee')) || [];
        const item = itens[index];

        if (item) {
            document.getElementById('nomeProduto').value = item.nome;
            document.getElementById('precoCusto').value = item.custo;
            document.getElementById('precoVenda').value = item.venda;
            document.getElementById('embalagem').value = item.embalagem || 0;
            document.getElementById('imposto').value = item.imposto || 0;
            document.getElementById('campanhaDatasDuplas').checked = item.datasDuplas || false;

            calcular();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    }

    function excluirItem(index) {
        let itens = JSON.parse(localStorage.getItem('shopee_itens')) || JSON.parse(localStorage.getItem('itensSalvosShopee')) || [];
        itens.splice(index, 1);
        localStorage.setItem('shopee_itens', JSON.stringify(itens));
        localStorage.setItem('itensSalvosShopee', JSON.stringify(itens));
        renderizarItens();
    }

    function limparTudo() {
        if (confirm('Deseja apagar todos os itens salvos?')) {
            localStorage.removeItem('shopee_itens');
            localStorage.removeItem('itensSalvosShopee');
            renderizarItens();
        }
    }

    window.onload = function() {
        renderizarItens();
    };
</script>

</body>
</html>
